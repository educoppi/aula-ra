<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cartão Profissional em RA — Eduardo Coppi</title>

    <!-- Fonte usada nos painéis (desenhados em canvas pelo app.js) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">

    <!-- A-Frame: monta a cena 3D. MindAR: reconhece e rastreia o cartão (image tracking) -->
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <script src="js/app.js"></script>
</head>

<body>
    <!-- ===================== INTERFACE HTML (sobreposta à câmera) ===================== -->
    <div id="scan-hint" class="hint">
        <div class="scan-frame"></div>
        <p>Aponte a câmera para o <strong>cartão</strong></p>
    </div>

    <nav id="tabs" class="tabs hidden" aria-label="Seções do cartão">
        <button data-tab="sobre" class="active">Sobre</button>
        <button data-tab="skills">Skills</button>
        <button data-tab="projeto">Projeto</button>
        <button data-tab="formacao">Formação</button>
        <button data-tab="contato">Contato</button>
    </nav>

    <div id="links" class="links hidden">
        <a href="https://www.linkedin.com/in/eduardocoppi2004/" target="_blank" rel="noopener">LinkedIn</a>
        <a href="https://github.com/educoppi" target="_blank" rel="noopener">GitHub</a>
        <a href="https://github.com/educoppi/finance-dashboard" target="_blank" rel="noopener">Projeto</a>
    </div>

    <!-- ===================== CENA DE REALIDADE AUMENTADA ===================== -->
    <!--
        mindar-image: carrega o target compilado (.mind) e liga o tracking.
        filterMinCF / filterBeta: filtro que suaviza a pose (menos tremor).
        uiScanning: no -> usamos a nossa própria dica de "aponte a câmera".
        cursor + raycaster: permitem tocar nos objetos 3D com a classe .clickable.
    -->
    <a-scene
        mindar-image="imageTargetSrc: ./assets/targets/targets.mind; filterMinCF: 0.0001; filterBeta: 0.001; uiScanning: no"
        renderer="colorManagement: true; antialias: true"
        vr-mode-ui="enabled: false"
        device-orientation-permission-ui="enabled: false"
        cursor="rayOrigin: mouse; fuse: false"
        raycaster="objects: .clickable"
        embedded>

        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <!--
            Âncora do target 0 (o cartão). Tudo dentro dela segue a POSE do cartão.
            Unidades: largura do cartão = 1; altura = 1100/1700 ≈ 0.647.
            Bordas do cartão: x = ±0.5  |  y = ±0.32
        -->
        <a-entity id="card-target" mindar-image-target="targetIndex: 0">

            <!-- BLOCO 1 — Cabeçalho (nome + área). POSITION animada: flutua acima do cartão -->
            <a-plane id="header-panel" class="panel"
                width="1.05" height="0.30"
                position="0 0.55 0.05"
                scale="0 0 0"
                animation__float="property: position; from: 0 0.55 0.05; to: 0 0.59 0.05; dir: alternate; loop: true; dur: 1800; easing: easeInOutSine">
            </a-plane>

            <!-- Logo 3D: prisma hexagonal sobre o hexágono "EC" impresso. ROTATION contínua -->
            <a-entity position="-0.353 0.206 0.09">
                <a-cylinder id="logo" segments-radial="6" radius="0.075" height="0.03"
                    rotation="90 0 0" scale="0 0 0"
                    material="color: #f89820; metalness: 0.3; roughness: 0.4"
                    animation__spin="property: rotation; from: 90 0 0; to: 90 360 0; loop: true; dur: 6000; easing: linear">
                </a-cylinder>
            </a-entity>

            <!-- BLOCO 2 — Habilidades: os 3 chips impressos "saltam" do cartão (SCALE + POSITION em Z) -->
            <a-entity id="skills" position="0 -0.194 0.07">
                <a-plane class="skill clickable" data-skill="java"   width="0.10" height="0.05" position="-0.371 0 0"    scale="0 0 0"></a-plane>
                <a-plane class="skill clickable" data-skill="spring" width="0.19" height="0.05" position="-0.219 0 0.02" scale="0 0 0"></a-plane>
                <a-plane class="skill clickable" data-skill="jwt"    width="0.10" height="0.05" position="-0.067 0 0.04" scale="0 0 0"></a-plane>
            </a-entity>

            <!-- BLOCO 3 — Abas 3D clicáveis logo abaixo do cartão -->
            <a-entity id="tab-buttons" position="0 -0.43 0.03"></a-entity>

            <!-- BLOCO 4 — Painel de conteúdo da aba selecionada. ROTATION em X: inclinado para o usuário -->
            <a-plane id="info-panel" class="panel clickable"
                width="1.05" height="0.50"
                position="0 -0.76 0.06"
                rotation="-12 0 0"
                scale="0 0 0">
            </a-plane>

            <!-- Luzes para o logo 3D (os painéis usam shader flat e não dependem de luz) -->
            <a-entity light="type: ambient; intensity: 0.8"></a-entity>
            <a-entity light="type: directional; intensity: 0.9" position="0.5 1 1"></a-entity>
        </a-entity>
    </a-scene>
</body>
</html>
